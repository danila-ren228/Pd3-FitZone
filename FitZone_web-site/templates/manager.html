<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FITZONE — Панель менеджера</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <div class="logo">FIT<span>ZONE</span></div>
    <div class="header-actions">
        <button class="btn-outline" onclick="toggleTheme()" style="padding: 8px 12px; font-size: 12px;">🌓</button>
        <a href="/" class="btn-outline" style="padding: 8px 15px;">На сайт</a>
    </div>
</header>

<div class="container" style="padding-top: 120px;">
    <div class="panel-header">FITZONE / ПАНЕЛЬ УПРАВЛЕНИЯ МЕНЕДЖЕРА</div>

    <!-- Переключатель дней недели -->
    <div class="schedule-tabs" style="justify-content: flex-start; margin-bottom: 20px;">
        <button class="tab-btn active" onclick="filterDay('Понедельник', this)">Понедельник</button>
        <button class="tab-btn" onclick="filterDay('Вторник', this)">Вторник</button>
        <button class="tab-btn" onclick="filterDay('Среда', this)">Среда</button>
        <button class="tab-btn" onclick="filterDay('Четверг', this)">Четверг</button>
        <button class="tab-btn" onclick="filterDay('Пятница', this)">Пятница</button>
        <button class="tab-btn" onclick="filterDay('Суббота', this)">Суббота</button>
        <button class="tab-btn" onclick="filterDay('Воскресенье', this)">Воскресенье</button>
    </div>

    <!-- Таблица расписания из базы данных -->
    <div class="panel-box">
        <h2 id="table-title">Список занятий (Понедельник)</h2>
        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Дата и время</th>
                    <th>Тренировка</th>
                    <th>Тренер</th>
                    <th>Зал</th>
                    <th>Места</th>
                    <th>Действие</th>
                </tr>
            </thead>
            <tbody id="managerTable"></tbody>
        </table>
    </div>

    <!-- Форма добавления тренировки -->
    <div class="panel-box">
        <h2>+ Добавить тренировку</h2>
        <form id="addForm">
            <!--  5 колонок: Тренировка, Тренер, Зал, Дата/Время, Места -->
            <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-bottom: 15px;">
                <div class="form-group">
                    <label>Тренировка</label>
                    <input type="text" id="title" placeholder="CrossFit" required>
                </div>
                <div class="form-group">
                    <label>Тренер</label>
                    <input type="text" id="trainer" placeholder="Алексей Смирнов" required>
                </div>
                <div class="form-group">
                    <label>Зал</label>
                    <input type="text" id="room" placeholder="Зал 1" required>
                </div>
                <div class="form-group">
                    <label>Дата и время</label>
                    <input type="text" id="event_time" placeholder="17.11.2026 15:00" required>
                </div>
                <div class="form-group">
                    <label>Количество мест</label>
                    <input type="number" id="free_seats" placeholder="15" min="1" value="15" required>
                </div>
            </div>
            <button type="submit" class="btn-main">ДОБАВИТЬ В РАСПИСАНИЕ</button>
        </form>
    </div>
</div>

<script>
    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('fitzone_theme', next);
    }
    document.documentElement.setAttribute('data-theme', localStorage.getItem('fitzone_theme') || 'dark');

    let allWorkouts = [];
    let currentDay = 'Понедельник';

    // Функция определяет день недели по дате формата "17.11.2026 15:00"
    function getDayNameFromDate(dateStr) {
        if (!dateStr) return '';
        const parts = dateStr.split(' ')[0].split('.');
        if (parts.length !== 3) return '';
        const dateObj = new Date(parts[2], parts[1] - 1, parts[0]);
        const days = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
        return days[dateObj.getDay()];
    }

    function loadManagerSchedule(day = currentDay) {
        currentDay = day;
        fetch('/api/schedule')
            .then(res => res.json())
            .then(data => {
                allWorkouts = data;
                renderWorkouts(day);
            });
    }

    function renderWorkouts(day) {
        const tbody = document.getElementById('managerTable');
        document.getElementById('table-title').innerText = `Список занятий (${day})`;
        tbody.innerHTML = '';
        
        // Фильтруем тренировки по реальному дню недели из даты
        const filtered = allWorkouts.filter(w => getDayNameFromDate(w.event_time) === day);
        
        if(filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Нет тренировок в этот день</td></tr>';
            return;
        }
        filtered.forEach(item => {
            tbody.innerHTML += `
                <tr>
                    <td>${item.event_time}</td>
                    <td><b>${item.title}</b></td>
                    <td>${item.trainer}</td>
                    <td>${item.room}</td>
                    <td><span style="color:var(--accent); font-weight:bold;">${item.free_seats} чел.</span></td>
                    <td><button class="btn-main" style="background:#ff4444; color:#fff; padding:6px 12px; font-size:12px;" onclick="deleteWorkout(${item.id})">Удалить</button></td>
                </tr>
            `;
        });
    }

    function filterDay(day, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderWorkouts(day);
    }

    loadManagerSchedule('Понедельник');

    document.getElementById('addForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const eventTimeVal = document.getElementById('event_time').value;
        
        fetch('/api/schedule', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                title: document.getElementById('title').value,
                trainer: document.getElementById('trainer').value,
                room: document.getElementById('room').value,
                event_time: eventTimeVal,
                free_seats: parseInt(document.getElementById('free_seats').value)
            })
        }).then(res => res.json()).then(data => {
            if(data.status === 'success') {
                alert('Тренировка успешно добавлена в расписание!');
                const addedDay = getDayNameFromDate(eventTimeVal) || currentDay;
                
                // Переключаем активную вкладку на тот день недели, куда добавили тренировку
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.innerText === addedDay);
                });
                
                loadManagerSchedule(addedDay);
                document.getElementById('addForm').reset();
            }
        });
    });

    function deleteWorkout(id) {
        fetch(`/api/schedule?id=${id}`, { method: 'DELETE' })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') { loadManagerSchedule(currentDay); }
            });
    }
</script>

</body>
</html>
