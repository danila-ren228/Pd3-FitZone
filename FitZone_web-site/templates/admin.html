<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FITZONE — Панель администратора</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <div class="logo">FIT<span>ZONE</span></div>
    <div class="header-actions">
        <button class="btn-outline" onclick="toggleTheme()" style="padding: 8px 12px; font-size: 12px;">🌓</button>
        <a href="/" class="btn-outline" style="padding: 8px 15px;">На сайт</a>
    </div>
</header>

<div class="container" style="padding-top: 120px; max-width: 1200px; margin: 0 auto; padding-left: 20px; padding-right: 20px;">
    <div class="panel-header" style="font-size: 20px; font-weight: bold; margin-bottom: 25px; color: var(--accent);">FITZONE / ПАНЕЛЬ АДМИНИСТРАТОРА</div>

    <div class="panel-box" style="background: var(--bg-card); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color);">
        <h2 style="margin-bottom: 20px; font-size: 18px;">Список клиентов и записей</h2>
        <table class="schedule-table" style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="background: var(--bg-card-hover); color: var(--accent); text-align: left;">
                    <th style="padding: 12px;">ID</th>
                    <th style="padding: 12px;">ФИО Клиента</th>
                    <th style="padding: 12px;">Телефон</th>
                    <th style="padding: 12px;">Тариф</th>
                    <th style="padding: 12px;">Заметка / Тренер</th>
                    <th style="padding: 12px;">Тренировка</th>
                    <th style="padding: 12px;">Статус</th>
                    <th style="padding: 12px;">Действие</th>
                </tr>
            </thead>
            <tbody id="adminBookingsTable"></tbody>
        </table>
    </div>
    <div class="panel-box">
        <h2>Управление пользователями и ролями</h2>
        <table class="admin-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>ФИО</th>
                    <th>Телефон</th>
                    <th>Роль в системе</th>
                </tr>
            </thead>
            <tbody id="users-table-body"></tbody>
        </table>
    </div>


</div>

<script>
    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('fitzone_theme', next);
    }
    document.documentElement.setAttribute('data-theme', localStorage.getItem('fitzone_theme') || 'dark');

    function loadAdminBookings() {
        fetch('/api/admin/bookings')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('adminBookingsTable');
                tbody.innerHTML = '';
                
                if(data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding: 20px;">Нет активных заявок</td></tr>';
                    return;
                }
                
                data.forEach(b => {
                    // Выбираем цвет текста для статуса
                    let statusColor = '#ffcc00'; // Ожидает
                    if (b.status === 'Подтверждено') statusColor = 'var(--accent)';
                    if (b.status === 'Отклонено') statusColor = '#ff4444';

                    // Кнопки отображаются, только если заявка еще в ожидании
                    const actionButtons = b.status === 'Ожидает'
                        ? `<div style="display: flex; gap: 8px;">
                               <button class="btn-main" style="padding: 6px 12px; font-size: 12px;" onclick="updateStatus(${b.id}, 'confirm')">Подтвердить</button>
                               <button class="btn-main" style="background: #ff4444; color: #fff; padding: 6px 12px; font-size: 12px;" onclick="updateStatus(${b.id}, 'reject')">Отклонить</button>
                           </div>`
                        : `<span style="color: var(--text-muted); font-size: 12px;">Обработано</span>`;

                    tbody.innerHTML += `
                        <tr style="border-bottom: 1px solid var(--border-color);">
                            <td style="padding: 12px;">#${b.id}</td>
                            <td style="padding: 12px;"><b>${b.client_name}</b></td>
                            <td style="padding: 12px;">${b.phone}</td>
                            <td style="padding: 12px;">${b.tariff}</td>
                            <td style="padding: 12px;">${b.trainer_note || '-'}</td>
                            <td style="padding: 12px;">${b.workout_title || '-'}</td>
                            <td style="padding: 12px;"><span style="color: ${statusColor}; font-weight: bold;">${b.status}</span></td>
                            <td style="padding: 12px;">${actionButtons}</td>
                        </tr>
                    `;
                });
            });
    }

    // Функция отправки нажатия на кнопку в Flask
    function updateStatus(bookingId, action) {
        fetch(`/api/admin/booking/${bookingId}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: action })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                loadAdminBookings(); // Сразу обновляем список заявок без перезагрузки страницы
            } else {
                alert(data.message || 'Ошибка при обновлении статуса');
            }
        });
    }

    // Загружаем заявки при открытии страницы
    loadAdminBookings();
            async function loadUsers() {
            const res = await fetch('/api/admin/users');
            if (!res.ok) return;
            const users = await res.json();
            const tbody = document.getElementById('users-table-body');
                        tbody.innerHTML = users.map(u => `
                <tr>
                    <td>#${u.id}</td>
                    <td><b>${u.fullname}</b></td>
                    <td>${u.phone}</td>
                    <td>
                        <select class="role-select" onchange="changeUserRole(${u.id}, this.value)">
                            <option value="user" ${u.role === 'user' ? 'selected' : ''}>Клиент (user)</option>
                            <option value="manager" ${u.role === 'manager' ? 'selected' : ''}>Менеджер (manager)</option>
                            <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Администратор (admin)</option>
                        </select>
                    </td>
                </tr>
            `).join('');
        }

        async function changeUserRole(userId, newRole) {
            const res = await fetch(`/api/admin/user/${userId}/role`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ role: newRole })
            });
            const data = await res.json();
            if (res.ok) {
                alert('Роль пользователя успешно обновлена!');
            } else {
                alert(data.message || 'Ошибка при смене роли');
                loadUsers();
            }
        }

        loadUsers();

</script>

</body>
</html>
